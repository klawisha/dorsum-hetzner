name: Security and regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: dorsum_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d dorsum_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://postgres:test-only-ci-password@127.0.0.1:5432/dorsum_test
      TEST_DATABASE_URL: postgresql://postgres:test-only-ci-password@127.0.0.1:5432/dorsum_test
      NATIVE_POSTGRES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --audit-level=moderate
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check private administrator bootstrap
        run: python3 -m unittest discover -s infra/deploy/tests -v
      - name: Generate isolated test configuration
        run: python3 infra/deploy/configure.py --api-domain api.ci.example --app-origin https://ci.example --email admin@example.com
      - name: Validate Compose and build API image
        run: |
          cd infra/deploy
          docker compose config --quiet
          docker compose build api
      - name: Migrate database and verify restricted runtime role
        run: |
          cd infra/deploy
          docker compose up -d db
          docker compose run --rm migrate
          docker compose exec -T db psql -X -U dorsum_owner -d dorsum -f /ops/db-grants.sql >/dev/null
          docker compose up -d api
          for attempt in $(seq 1 30); do
            if docker compose exec -T api node -e "fetch('http://127.0.0.1:5000/health/ready').then(r=>process.exit(r.ok?0:1))"; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify Caddy network allocation and configuration after API starts
        run: |
          cd infra/deploy
          docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - if: always()
        run: cd infra/deploy && docker compose down
